spring:
  application:
    name: storemis
  profiles:
    default: dev
  datasource:
    url: ${STOREMIS_DB_URL:jdbc:postgresql://localhost:5432/storemis}
    username: ${STOREMIS_DB_USER:storemis}
    password: ${STOREMIS_DB_PASSWORD:storemis}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Kabul
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: false

server:
  port: ${STOREMIS_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

storemis:
  timezone: Asia/Kabul
  jwt:
    # Must be at least 32 bytes. Override in production with STOREMIS_JWT_SECRET.
    secret: ${STOREMIS_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: ${STOREMIS_ACCESS_TTL:30m}
    refresh-token-ttl: ${STOREMIS_REFRESH_TTL:12h}
    issuer: storemis
  cookie:
    name: storemis_rt
    path: /api/v1/auth
    # Set to true only when the store serves the app over HTTPS.
    secure: ${STOREMIS_COOKIE_SECURE:false}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
  bootstrap-admin:
    username: ${STOREMIS_ADMIN_USERNAME:admin}
    password: ${STOREMIS_ADMIN_PASSWORD:}
    full-name: ${STOREMIS_ADMIN_FULLNAME:Administrator}
  files:
    dir: ${STOREMIS_FILES_DIR:./data/files}
