name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: mvn -B -f backend/pom.xml verify

  frontend:
    name: Frontend lint, translations, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  images:
    name: Production images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production stack
        working-directory: deploy
        run: docker compose --env-file .env.example build
      - name: Start it and check that the app answers
        working-directory: deploy
        run: |
          sed -e 's/^DB_PASSWORD=.*/DB_PASSWORD=CiDatabasePassword123/' -e 's/^JWT_SECRET=.*/JWT_SECRET=CiJwtSecretValue0123456789abcdefghijklmn/' -e 's/^HTTP_PORT=.*/HTTP_PORT=8080/' .env.example > .env
          mkdir -p backups backups-external
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/v1/settings/public > /dev/null; then echo "Store MIS is up"; break; fi
            sleep 5
          done
          curl -fs http://localhost:8080/api/v1/settings/public
          docker compose exec -T backup backup.sh
          docker compose exec -T backup list.sh
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail=200
